---
# Socle commun aux jobs Python. Une action composite plutot qu'un modele de
# job : GitHub Actions n'a pas d'equivalent de extends, et recopier ces trois
# etapes dans six workflows aurait rouvert exactement la derive que le fichier
# unique existe pour fermer.
#
# **Les roues CPU de torch, pas l'index CUDA du Makefile.** Un runner partage
# n'a pas de GPU, et cu130 y telechargerait deux gigaoctets de bibliotheques
# CUDA que rien n'executerait. docs/testing.md pose deja la regle dont ceci est
# la consequence : tout composant doit rester testable sans GPU, sinon la CI ne
# peut pas le valider.
#
# **L'environnement virtuel est sur le PATH.** Le Makefile appelle
# .venv/bin/python, mais le hook mypy de .pre-commit-config.yaml est declare en
# language: system et lance python -m mypy. Sans le PATH, ce python serait celui
# du runner, qui n'a ni mypy ni torch, et le hook echouerait sur une cause qui
# n'a rien a voir avec le code.
#
# Ni make ni git ne sont installes ici : l'image ubuntu-latest les porte deja,
# contrairement a python:3.12-slim. git reste indispensable et non optionnel,
# parce que check_dashes.py enumere ses fichiers avec git ls-files.

name: Environnement Python
description: Cree le venv, installe torch CPU et le projet, puis met le venv sur le PATH.

runs:
  using: composite
  steps:
    # Le cache pip suit pyproject.toml : il est reutilise tant que les versions
    # epinglees ne bougent pas, et invalide des qu'une seule change.
    - name: Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    # Deux etapes et non une : une entree ecrite dans GITHUB_PATH ne prend
    # effet qu'a l'etape suivante. C'est ce qui fait que le pip ci-dessous est
    # celui du venv et non celui du runner.
    - name: Environnement virtuel
      shell: bash
      run: |
        python -m venv .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    - name: Dependances du projet
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
      run: |
        python -m pip install --upgrade pip
        python -m pip install "torch>=2.13,<3.0" --index-url "$TORCH_CPU_INDEX"
        python -m pip install -e ".[api,train,dev,docs]"
