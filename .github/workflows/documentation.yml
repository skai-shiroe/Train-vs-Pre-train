---
# Etape documentation.
#
# **C'est ici que la derive du contrat est arretee.** make docs-lint appelle
# scripts/check_docs_sync.py, qui regenere openapi.json et l'environnement
# Postman depuis l'application et les compare aux fichiers versionnes. Une route
# ajoutee sans make docs-sync echoue ici plutot que d'atteindre un client sous
# la forme d'un contrat qui ne decrit plus le service.
#
# node n'est installe nulle part : markdownlint n'existe qu'en paquet npm, et
# l'image ubuntu-latest porte deja node et npx.

name: Documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    name: documentation et contrat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/environnement-python
      - run: make docs-lint
      - run: make docs

      # Verifie ici et non au deploiement : un site sans page d'accueil doit
      # echouer la ou le journal de la construction est encore sous les yeux.
      - name: Le site porte une page d'accueil
        run: test -f public/index.html

      # L'artefact est produit meme hors de la branche par defaut. Il n'est pas
      # deploye pour autant : c'est l'etape publication qui porte cette regle.
      - name: Artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
