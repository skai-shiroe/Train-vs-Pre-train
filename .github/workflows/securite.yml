---
# Etape securite. make security enchaine bandit sur le code et pip-audit sur les
# dependances, avec la liste d'exceptions du Makefile.
#
# Le rapport est televerse meme quand le job echoue : une vulnerabilite trouvee
# est exactement le cas ou l'on veut lire le detail, et un artefact conditionne
# au succes ne serait disponible que lorsqu'il n'apprend rien.

name: Securite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  securite:
    name: securite du code et des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/environnement-python
      - run: make security
      - name: Rapport bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit
          path: reports/bandit.json
          if-no-files-found: warn
          retention-days: 7
