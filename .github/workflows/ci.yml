---
# Pipeline de la section 30.
#
# Le fichier racine reste leger : declencheurs, concurrence, et un appel par
# etape. Aucun job n'y est defini. Chaque etape vit dans son propre workflow
# reutilisable, appele avec uses, comme les include: local du pipeline modulaire
# d'origine.
#
# Les jobs appellent les cibles du Makefile plutot que de reecrire les
# commandes. Le README promet que make ci produit le meme verdict
# que le pipeline : deux listes de commandes maintenues en parallele auraient
# fini par diverger, et c'est la promesse qui serait devenue fausse.
#
# Quatre etapes, du moins cher au plus cher. Le style echoue en une minute, la
# couverture prend plusieurs minutes et l'image davantage : les faire tourner
# dans cet ordre rend la boucle courte pour l'erreur la plus frequente.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Le groupe evite le doublon classique : sans lui, une poussee sur une branche
# qui porte une pull request declenche deux executions identiques, celle de la
# branche et celle de la pull request, et fait payer deux fois la meme
# verification. head_ref vaut le nom de la branche source d'une pull request et
# ref_name celui de la branche poussee : les deux tombent dans le meme groupe,
# et la plus recente annule l'autre.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    uses: ./.github/workflows/qualite.yml

  securite:
    needs: qualite
    uses: ./.github/workflows/securite.yml

  tests:
    needs: securite
    uses: ./.github/workflows/tests.yml

  conteneur:
    needs: tests
    uses: ./.github/workflows/conteneur.yml
