---
# Etape publication, sur GitHub Pages.
#
# Le site n'est pas reconstruit : il est repris tel quel de l'artefact produit
# par l'etape documentation, pour que ce qui est publie soit exactement ce qui
# a ete verifie.
#
# Le depot doit avoir GitHub Pages active avec GitHub Actions comme source.
# Sans ce reglage, le deploiement echoue sur la configuration du depot et non
# sur le contenu du site.

name: Publication

on:
  workflow_call:

# id-token sert au jeton OIDC que deploy-pages presente au service Pages, et
# pages a l'ecriture du deploiement. Le workflow appelant doit accorder les
# deux : les permissions d'un workflow reutilisable sont bornees par les
# siennes.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    name: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Deploiement du site
        id: deploiement
        uses: actions/deploy-pages@v4
