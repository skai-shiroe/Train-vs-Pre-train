---
# Shift Left : ce qui peut etre detecte sur le poste du developpeur ne doit pas
# consommer un runner CI. La CI rejoue ces memes hooks sur tout le depot.
# Voir section 37.4 du cahier des charges.
#
# Les revisions sont epinglees. Mettre a jour avec : pre-commit autoupdate

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

fail_fast: false

repos:
  # -------------------------------------------------------------------------
  # Hygiene de base du depot
  # -------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        # mkdocs.yml porte un tag !!python/name pour les blocs Mermaid, que le
        # chargeur sur de PyYAML refuse par construction. yamllint et
        # mkdocs build --strict le valident deja.
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # -------------------------------------------------------------------------
  # Formatage et linting Python
  # -------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear==24.10.31]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # mypy tourne dans l'environnement du projet, pas dans un environnement isole.
  # PyTorch pese plusieurs gigaoctets : le dupliquer dans un environnement de
  # hook serait absurde, et sans lui le typage du code ML n'a aucune valeur.
  # L'environnement virtuel doit donc etre actif. Voir docs/contributing.md.
  - repo: local
    hooks:
      - id: mypy
        name: typage statique (mypy, environnement du projet)
        entry: python -m mypy
        language: system
        files: ^(src|backend/app)/
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Securite
  # -------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -ll]
        additional_dependencies: ["bandit[toml]"]
        files: ^(src|backend/app)/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(\.venv/|data/|reports/|.*\.lock)$

  # -------------------------------------------------------------------------
  # Orthographe et qualite redactionnelle
  # -------------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--ignore-words=.codespell-ignore]
        exclude: ^(\.venv/|data/|reports/|.*\.(lock|svg|png|jpg|ipynb))$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml, --strict]

  # -------------------------------------------------------------------------
  # Notebooks
  # -------------------------------------------------------------------------
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # -------------------------------------------------------------------------
  # Regles specifiques au projet
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      # Section 1.1 : interdiction stricte des tirets longs. Regle bloquante,
      # verifiee mecaniquement et non par relecture.
      - id: no-long-dashes
        name: interdiction des tirets cadratin et demi-cadratin
        entry: python scripts/check_dashes.py
        language: system
        types_or: [python, markdown, yaml, toml, json]

      # Conventional Commits. Format documente dans docs/contributing.md.
      - id: conventional-commit
        name: format du message de commit
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true

      # Hooks couteux : uniquement avant de pousser.
      - id: pytest-fast
        name: tests rapides
        entry: python -m pytest -q -m "not slow and not smoke and not gpu"
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: docs-sync-check
        name: synchronisation de la documentation generee
        entry: python scripts/check_docs_sync.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
