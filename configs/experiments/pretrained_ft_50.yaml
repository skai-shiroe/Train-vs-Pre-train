---
# Ablation principale, section 11. Fine-tuning de t5-small sur 50 % du corpus
# de travail, soit les memes 10 000 exemples que scratch_50.

experiment:
  name: pretrained_ft_50
  seed: 42
  studies: [dataset_size]
  description: t5-small fine-tune sur 50 pour cent du corpus de travail.

dataset:
  config: configs/data/xsum.yaml
  percentage: 50

model:
  type: pretrained
  baseline: t5
  # Revision epinglee. Les poids sont les notres, mais l'architecture dans
  # laquelle ils sont charges vient du hub : sans revision fixee, elle change
  # sans que la version du registre change. Section 14.
  revision: df1b051c49625cf57a3d0d8d3863ed4d13564fe4  # pragma: allowlist secret
  mode: fine_tuned

training:
  epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: linear
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  label_smoothing: 0.1
  mixed_precision: true
  early_stopping_patience: 2
  group_by_length: true
  mega_batch_factor: 50
  log_every_steps: 50
  device: auto

evaluation:
  split: test
  batch_size: 8
  max_new_tokens: 64
  min_new_tokens: 0
  num_beams: 4
  no_repeat_ngram_size: 3
  bootstrap_samples: 1000
  confidence: 0.95
