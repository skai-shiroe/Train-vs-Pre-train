---
# Ablation principale, section 11. 50 % du corpus de travail, soit 10 000
# exemples d'entrainement. Le sous-ensemble 10 % en est un prefixe.
#
# Meme budget d'optimisation que random_t5_50 et pretrained_ft_50 : 3 epoques
# a 1e-4.

experiment:
  name: scratch_50
  seed: 42
  studies: [dataset_size]
  description: Transformer from scratch sur 50 pour cent du corpus de travail.

dataset:
  config: configs/data/cnn_dailymail.yaml
  percentage: 50

# La forme suit celle de t5-small : 512 de largeur, 8 tetes, 6 + 6 couches,
# 2 048 de largeur interne. Le modele pese alors 60 575 744 parametres contre
# 60 506 624 pour t5-small, 0,11 % d'ecart. Le budget de parametres est donc
# le meme ; l'architecture, elle, ne l'est pas, et la section 2 du rapport dit
# ce que cet ecart de 69 120 recouvre.
model:
  type: scratch
  d_model: 512
  num_heads: 8
  encoder_layers: 6
  decoder_layers: 6
  d_ff: 2048
  dropout: 0.1
  max_position: 512

training:
  epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: linear
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  label_smoothing: 0.1
  mixed_precision: true
  early_stopping_patience: 2
  group_by_length: true
  mega_batch_factor: 50
  log_every_steps: 50
  device: auto

evaluation:
  split: test
  batch_size: 8
  max_new_tokens: 128
  min_new_tokens: 0
  num_beams: 4
  no_repeat_ngram_size: 3
  bootstrap_samples: 1000
  confidence: 0.95
