---
# Corpus de travail du projet. Voir section 2.2 du cahier des charges.
#
# Le « 100 % » des ablations designe les 20 000 exemples definis ici, jamais
# CNN/DailyMail complet qui en compte environ 287 000. Cette convention est
# rappelee dans chaque tableau de resultats et sur chaque figure.

name: cnn_dailymail

dataset:
  hf_id: abisee/cnn_dailymail
  # CNN/DailyMail est publie en plusieurs configurations. La 3.0.0 est celle
  # de See et al. 2017, celle que la litterature de resume rapporte : elle
  # expose l'article complet et les puces de highlights sans anonymisation
  # des entites, contrairement aux 1.0.0 et 2.0.0.
  hf_config: "3.0.0"
  revision: null
  source_column: article
  target_column: highlights
  id_column: id

working_corpus:
  # Tirage unique, fige par cette graine. Ne jamais la modifier : les splits
  # doivent rester identiques pour toutes les comparaisons.
  seed: 42
  train_size: 20000
  validation_size: 1000
  test_size: 1000

# Sous-ensembles emboites : 10 % est un prefixe de 50 %, lui-meme prefixe de
# 100 %. L'emboitement isole l'effet de la taille de celui de la composition.
proportions: [10, 50, 100]

preprocess:
  # Les articles CNN/DailyMail sont longs : le plancher n'ecarte que les
  # depeches tronquees a l'archivage, et le plafond que les quelques articles
  # aberrants de plusieurs dizaines de milliers de caracteres.
  min_source_chars: 200
  max_source_chars: 20000
  # Les highlights font trois a quatre phrases, environ 300 caracteres. Le
  # plancher ecarte les references reduites a une bribe.
  min_target_chars: 50
  max_target_chars: 2000
  normalise_unicode: true
  # Les highlights sont stockes une puce par ligne. L'aplatissement les joint
  # en une seule ligne, ce que le JSONL exige et ce que ROUGE-L attend ici.
  collapse_whitespace: true

tokenizer:
  # Tokenizer partage par le modele from scratch et par la baseline.
  hf_id: t5-small
  source_prefix: "summarize: "
  max_source_tokens: 512
  # La reference fait trois a quatre phrases, environ 90 tokens t5. Le
  # plafond les couvre sans tronquer la queue de la distribution.
  max_target_tokens: 128

paths:
  raw: data/raw/cnn_dailymail
  processed: data/processed/cnn_dailymail
