---
extends: default

ignore: |
  .venv/
  site/
  public/
  node_modules/

rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: true
  truthy:
    # GitHub Actions utilise des cles non booleennes, a commencer par on.
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
