StylesPath = .vale/styles

# Langue de redaction du rapport : francais.
# Le code et les docstrings restent en anglais, ils ne sont pas analyses ici.
MinAlertLevel = warning

Vocab = Syntra

[*.md]
BasedOnStyles = Vale, Syntra

# Vale.Spelling s'appuie sur un dictionnaire anglais. Le rapport etant redige
# en francais, l'orthographe est deleguee a codespell et au vocabulaire projet.
Vale.Spelling = NO

# Longueur de phrase : rapporte sans bloquer, conformement aux regles de
# severite de la section 37.5.
Vale.Terms = warning
