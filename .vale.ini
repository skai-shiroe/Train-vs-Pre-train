StylesPath = docs/styles

# Langue de redaction de la documentation : francais.
# Le code et les docstrings restent en anglais, ils ne sont pas analyses ici.
MinAlertLevel = warning

Vocab = Syntra

[*.md]
BasedOnStyles = Vale, Syntra

# Vale.Spelling s'appuie sur un dictionnaire anglais. La documentation etant
# redigee en francais, l'orthographe est deleguee a codespell et au vocabulaire
# projet. Voir docs/contributing.md.
Vale.Spelling = NO

# Longueur de phrase : rapporte sans bloquer, conformement aux regles de
# severite de la section 37.5.
Vale.Terms = warning
