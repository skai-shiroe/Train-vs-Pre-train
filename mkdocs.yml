---
site_name: Syntra
site_description: Backend NLP de resume automatique, Transformer from scratch face a T5
site_dir: public
docs_dir: docs
use_directory_urls: true

# Le build tourne en mode strict dans la CI : tout lien mort casse le job.
strict: true

# docs/_generated tient les fragments produits par
# python -m src.experiments.fragments. Ce sont des inclusions, pas des pages :
# publiees telles quelles, elles apparaitraient comme des pages orphelines
# faites d'un seul tableau, hors navigation et indexees par la recherche.
exclude_docs: |
  _generated/

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

plugins:
  - search:
      lang: fr
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # check_paths fait echouer le build sur une inclusion manquante. Sans lui, un
  # fragment absent est rendu comme une chaine vide : le rapport perdrait un
  # tableau sans que rien ne le signale, ce qui est exactement le defaut que
  # ces inclusions existent pour supprimer.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Accueil: index.md
  - Rapport: report.md
  - Machine Learning:
      - Corpus: ml/data.md
      - Transformer from scratch: ml/transformer.md
      - Transformer explique simplement: ml/transformer-eli5.md
      - Baseline pre-entrainee: ml/baseline.md
      - Entrainement: ml/training.md
      - Evaluation: ml/evaluation.md
      - Tracabilite MLflow: ml/tracking.md
      - Registre de modeles: ml/registry.md
  - API: api/index.md
  - Experiences et ablations: experiments/index.md
  - Conformite aux requirements: conformity.md
  - Reproductibilite: reproducibility.md
  - Tests: testing.md
  - Deploiement: deployment.md
  - Securite: security.md
  - Contribuer: contributing.md
  - Glossaire: glossary.md
