[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntra"
version = "0.1.0"
description = "Chaine ML experimentale de resume automatique, t5-small aleatoire face a t5-small pre-entraine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Syntra" }]
keywords = ["nlp", "transformer", "summarization", "pytorch"]

# Une seule liste : le depot ne construit plus d'image, donc il n'y a plus de
# raison de separer ce que l'inference embarquait de ce que l'entrainement
# demandait. Tout ce qui suit sert la chaine data -> train -> evaluate.
#
# Le plancher torch est a 2.13 : GHSA-rrmf-rvhw-rf47 touche toute la serie
# inferieure. Consequence pour le poste GPU, l'index CUDA du Makefile passe en
# cu130, seul index a publier cette version.
#
# sentencepiece n'est importe nulle part et reste obligatoire : c'est lui qui
# porte le vocabulaire T5, charge par transformers au premier appel du
# tokenizer. absl-py et nltk sont dans le meme cas pour rouge-score.
dependencies = [
  "torch>=2.13,<3.0",
  "transformers>=4.46,<5.0",
  "datasets>=3.0,<5.0",
  "sentencepiece>=0.2,<1.0",
  "rouge-score>=0.1.2,<1.0",
  "absl-py>=2.1,<3.0",
  "nltk>=3.9,<4.0",
  "mlflow>=2.17,<4.0",
  # Pilote du magasin MLflow. Les metadonnees des runs vivent dans PostgreSQL ;
  # les artefacts, poids compris, restent des fichiers sous MLFLOW_ARTIFACT_ROOT.
  "psycopg2-binary>=2.9,<3.0",
  "matplotlib>=3.9,<4.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

# Analyse exploratoire. Groupe separe : le notebook lit le corpus deja prepare,
# et rien dans la chaine ne doit tirer une chaine Jupyter pour s'executer.
# Voir notebooks/01_eda_cnn_dailymail.ipynb.
eda = [
  "jupyterlab==4.5.5",
  "ipykernel==6.31.0",
  "nbconvert==7.16.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------

# Ruff est seul : la purge du depot a emporte flake8, qui tenait PEP8, et son
# plafond de ligne. E et W reprennent ce role ici. BLE et SLF sont selectionnes
# parce que le code porte deja les cinq derogations qui vont avec, une par
# `except Exception` de frontiere et deux acces a un attribut prive depuis un
# test : sans la regle, la derogation ne veut plus rien dire.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "reports", "runs", "mlruns", "mlartifacts", ".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle, erreurs
  "W",    # pycodestyle, avertissements
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplifications
  "RET",  # returns
  "PTH",  # pathlib plutot que os.path
  "ARG",  # arguments inutilises
  "N",    # conventions de nommage
  "D",    # docstrings
  "BLE",  # except Exception nu
  "SLF",  # acces a un attribut prive
]
ignore = [
  "D203",  # incompatible avec D211
  "D213",  # incompatible avec D212
  "N812",  # import torch.nn.functional as F : convention universelle de PyTorch
]

[tool.ruff.lint.per-file-ignores]
# Un test lit les internes de ce qu'il teste, c'est meme souvent son sujet.
"tests/**" = ["D", "ARG", "SLF001"]
# Un carnet est une prose qui execute : ses imports viennent apres la cellule
# qui pose la racine du depot sur sys.path (E402), ses lignes d'affichage
# alignent des colonnes qu'un retour a la ligne desaligne (E501), le carnet 3
# appelle les methodes privees du modele parce que c'est ce qu'il montre
# (SLF001), et une fonction definie dans une cellule est deja expliquee par la
# cellule de texte au-dessus (D).
"notebooks/**" = ["E402", "E501", "SLF001", "D"]
# Les callbacks implementent une interface fixe : un observateur qui n'utilise
# pas l'etat de la boucle garde quand meme l'argument dans sa signature.
"src/training/callbacks.py" = ["ARG002"]
# Meme raison : NullTracker implemente le protocole Tracker et ignore la charge
# utile par construction. C'est ce qui distingue "ne rien tracer" de "tracer".
"src/tracking/client.py" = ["ARG002"]
# Les deux raisons a la fois : NullLiveRun ignore ce qu'il recoit, et
# LiveMetricsCallback est un observateur qui n'a pas besoin de tout l'etat.
"src/tracking/live.py" = ["ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "unit: test unitaire rapide et isole",
  "integration: test d'integration entre deux composants",
  "slow: test long",
  "gpu: test necessitant un GPU CUDA",
]
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
