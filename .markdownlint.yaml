---
# Configuration markdownlint. Voir section 38.3 du cahier des charges.

default: true

# MD013 : la longueur de ligne n'est pas pertinente pour du Markdown redige
# en une phrase par ligne. Le linter de prose controle la lisibilite.
MD013: false

# MD024 : des titres identiques sont acceptes dans des sections differentes.
MD024:
  siblings_only: true

# MD033 : le HTML inline reste autorise pour les tableaux complexes et les details.
MD033:
  allowed_elements:
    - details
    - summary
    - br

# MD041 : le premier titre du fichier doit etre de niveau 1.
MD041: true

# MD046 : style de bloc de code uniforme.
MD046:
  style: fenced

# MD048 : delimiteur de bloc de code uniforme.
MD048:
  style: backtick
