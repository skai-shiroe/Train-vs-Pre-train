# Configuration du modèle T5 pré-entraîné
# Utilisation de T5-small, T5-base ou T5-large

model:
  type: "t5"
  model_name: "t5-small"  # Options: t5-small, t5-base, t5-large
  tokenizer_name: "t5-small"
  
  # Generation
  generation:
    strategy: "beam_search"
    max_length: 128
    min_length: 10
    num_beams: 4
    early_stopping: true
    no_repeat_ngram_size: 3
    length_penalty: 1.0
    temperature: 1.0
    top_k: 50
    top_p: 0.95

training:
  # Paramètres spécifiques à T5
  learning_rate: 0.0001
  batch_size: 16
  num_epochs: 10
  warmup_steps: 1000
  
  # Fine-tuning
  freeze_encoder: false  # Geler l'encodeur pour un fine-tuning plus rapide
  freeze_embeddings: false
  
  # Optimiseur
  optimizer: "adamw"
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.01
  
  # Scheduler
  scheduler: "linear_with_warmup"

paths:
  checkpoint_dir: "outputs/checkpoints/t5"
  best_model: "outputs/checkpoints/t5/best_model"
  pretrained_model: "t5-small"  # Modèle pré-entraîné à charger depuis HuggingFace