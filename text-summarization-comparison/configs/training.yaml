# Configuration spécifique à l'entraînement
# Ce fichier étend la configuration par défaut

training:
  batch_size: 16
  num_epochs: 20
  learning_rate: 0.0001
  warmup_steps: 2000
  weight_decay: 0.01
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  seed: 42
  
  # Optimiseur
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  
  # Scheduler
  scheduler: "linear_with_warmup"
  
  # Early stopping
  early_stopping_patience: 5
  early_stopping_metric: "val_loss"
  
  # Mixed precision
  fp16: true
  bf16: false
  
  # Gradient checkpointing
  gradient_checkpointing: true
  
  # Logging
  logging_steps: 100
  save_steps: 500
  eval_steps: 500
  
  # Checkpointing
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "val_rouge2"
  greater_is_better: true