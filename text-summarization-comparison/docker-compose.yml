version: '3.8'

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-summarization-jupyter
    ports:
      - "8888:8888"
      - "6006:6006"  # TensorBoard (optionnel)
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
      - ./notebooks:/workspace/notebooks
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONUNBUFFERED=1
    runtime: nvidia  # Pour GPU NVIDIA (optionnel)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: jupyter lab --ip=0.0.0.0 --no-browser --allow-root --NotebookApp.token=''

  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-summarization-tensorboard
    ports:
      - "6007:6006"
    volumes:
      - ./outputs:/workspace/outputs
    command: tensorboard --logdir=outputs/checkpoints --bind_all
    depends_on:
      - jupyter

volumes:
  data:
  outputs: